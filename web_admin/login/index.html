<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | La Diabla 🌶️</title>
  <meta name="description" content="Panel de acceso administrativo de La Diabla App.">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/logo/LaDiabla.png">
  <link rel="shortcut icon" type="image/png" href="../assets/logo/LaDiabla.png">
  <link rel="apple-touch-icon" href="../assets/logo/LaDiabla.png">
  <!-- Google Fonts: Bangers & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols Rounded -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="../styles.css?v=4.0">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('diabla_web_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    /* ── SCROLLBAR PERSONALIZADA CON FONDO BLANCO ────────────── */
    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFFFF !important;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #EF4444 0%, #DC2626 50%, #991B1B 100%) !important;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #F87171 0%, #EF4444 50%, #B91C1C 100%) !important;
    }
    html, body, * {
      scrollbar-color: #DC2626 #FFFFFF !important;
      scrollbar-width: thin;
    }

    /* ── RESET Y FONDO GLOBAL ULTRA-LIMPIO ───────────────────── */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #F8FAFC;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: var(--text-main);
      transition: background-color 0.3s ease;
    }

    [data-theme="light"] html,
    [data-theme="light"] body {
      background-color: #F8FAFC !important;
      background: radial-gradient(circle at 50% 25%, rgba(220, 38, 38, 0.04) 0%, transparent 65%), #F8FAFC !important;
      color: #0F172A !important;
    }

    [data-theme="dark"] html,
    [data-theme="dark"] body {
      background-color: #0C0504 !important;
      background: radial-gradient(circle at 50% 25%, rgba(220, 38, 38, 0.12) 0%, transparent 65%), #0C0504 !important;
      color: #FFFFFF !important;
    }

    /* ── ANIMACIÓN Y REACCIÓN DEL LOGO AL MOUSE Y CLICK ──────── */
    .brand-logo-img {
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.5);
      border: 2px solid rgba(220, 38, 38, 0.65);
      background: #180905;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      animation: logoFlameGlow 2.8s infinite ease-in-out;
    }

    @keyframes logoFlameGlow {
      0%, 100% {
        box-shadow: 0 4px 14px rgba(220, 38, 38, 0.5);
      }
      50% {
        box-shadow: 0 6px 22px rgba(220, 38, 38, 0.9), 0 0 16px rgba(245, 158, 11, 0.65);
      }
    }

    /* Reactivo al pasar el mouse (hover) */
    .brand-logo-link:hover .brand-logo-img,
    .brand-logo-img:hover {
      transform: rotate(14deg) scale(1.15) !important;
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.9), 0 0 18px rgba(245, 158, 11, 0.7) !important;
    }

    /* Reactivo INMEDIATO cuando con el mouse le das click (active) */
    .brand-logo-link:active .brand-logo-img,
    .brand-logo-img:active {
      transform: scale(0.82) rotate(-16deg) !important;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.6) !important;
      transition: transform 0.08s ease !important;
    }

    /* Animación elástica al hacer click */
    @keyframes logoClickWobble {
      0% { transform: scale(0.82) rotate(-16deg); }
      35% { transform: scale(1.28) rotate(22deg); }
      60% { transform: scale(0.92) rotate(-8deg); }
      80% { transform: scale(1.08) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .logo-wobble {
      animation: logoClickWobble 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    /* ── CONTENEDOR PRINCIPAL QUE ENTRA COMPLETO AL 100% ──────── */
    .login-main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      position: relative;
    }

    /* Tarjeta compacta: cabe perfectamente en cualquier pantalla al 100% */
    .login-card {
      border-radius: 24px;
      padding: 1.75rem 2rem;
      width: 100%;
      max-width: 410px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    [data-theme="light"] .login-card {
      background: #FFFFFF !important;
      border: 1px solid #E2E8F0 !important;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(220, 38, 38, 0.08) !important;
    }

    [data-theme="dark"] .login-card {
      background: rgba(20, 10, 7, 0.95) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(220, 38, 38, 0.15) !important;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    /* Icono normalito: imagen limpia y redonda sin envolturas gruesas */
    .login-brand-logo {
      width: 54px;
      height: 54px;
      display: block;
      margin: 0 auto 0.65rem;
    }

    .login-title {
      font-family: 'Bangers', cursive;
      font-size: 1.8rem;
      color: var(--primary, #DC2626);
      margin-bottom: 0.2rem;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }

    .login-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.35;
      margin: 0;
    }

    /* ── FORMULARIO Y CAMPOS DE TEXTO ────────────────────────── */
    .form-group {
      margin-bottom: 0.85rem;
    }

    .form-label {
      display: flex;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-password-wrap .form-input {
      padding-right: 44px !important;
      font-family: inherit;
    }

    .form-input {
      width: 100%;
      padding: 0.72rem 0.85rem 0.72rem 38px;
      font-size: 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--card-border, #E2E8F0);
      background: var(--input-bg, #F8FAFC);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #DC2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    .input-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
      pointer-events: none;
    }

    /* ── BOTÓN TOGGLE OJITO CON ANIMACIÓN MATRIX ─────────────── */
    .btn-pw-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    .btn-pw-toggle:hover {
      color: var(--primary, #DC2626);
      background: rgba(220, 38, 38, 0.1);
    }

    .btn-pw-toggle .material-symbols-rounded {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 20px;
    }

    .eye-pop {
      animation: eyeBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes eyeBounce {
      0% {
        transform: scale(0.65) rotate(-15deg);
        color: #EF4444;
      }
      60% {
        transform: scale(1.22) rotate(6deg);
        color: #F59E0B;
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .login-submit-btn {
      width: 100%;
      justify-content: center;
      padding: 0.82rem;
      font-size: 0.96rem;
      margin-top: 0.45rem;
      gap: 8px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
      transition: all 0.25s ease;
    }

    .login-submit-btn:hover {
      background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
      box-shadow: 0 8px 22px rgba(220, 38, 38, 0.5);
      transform: translateY(-1px);
    }

    .login-footer-info {
      margin-top: 1.15rem;
      padding-top: 0.85rem;
      border-top: 1px dashed var(--divider, rgba(220,38,38,0.2));
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }

    .error-alert {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-main-container {
        padding: 1rem 0.85rem;
      }
      .login-card {
        padding: 1.5rem 1.25rem;
        border-radius: 20px;
      }
      .login-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="navbar" style="padding: 0.65rem 1.5rem;">
      <a href="../index.html" class="logo-container brand-logo-link">
        <img src="../assets/logo/LaDiabla.png" alt="La Diabla" class="brand-logo-img"
          onerror="this.src='../logo/LaDiabla.png';" style="width: 42px; height: 42px; flex-shrink: 0;">
        <span class="logo-text diabla-font" style="color: #FFFFFF !important; font-size: 1.7rem;">LA DIABLA ADMIN</span>
      </a>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button onclick="toggleWebTheme()" id="themeToggleBtn" class="btn-icon-text" title="Cambiar Tema">
          <span class="material-symbols-rounded md-20" id="themeIcon">light_mode</span>
          <span id="themeLabel">Claro</span>
        </button>
        <a href="../index.html" class="btn-icon-text" style="text-decoration: none;">
          <span class="material-symbols-rounded md-20">arrow_back</span>
          <span>Inicio</span>
        </a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL COMPLETO AL 100% -->
  <main class="login-main-container">
    <div class="login-card">

      <!-- Logo Normalito & Encabezado -->
      <div class="login-header">
        <img src="../assets/logo/LaDiabla.png" alt="La Diabla" class="brand-logo-img login-brand-logo"
          onerror="this.src='../logo/LaDiabla.png';">
        <h1 class="login-title">PANEL DE CONTROL</h1>
        <p class="login-subtitle">Acceso exclusivo para administradores de La Diabla</p>
      </div>

      <!-- Formulario de Login -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">
            <span class="material-symbols-rounded md-16" style="color: var(--primary, #DC2626); margin-right: 5px;">mail</span>
            Correo Electrónico
          </label>
          <div class="input-icon-wrap">
            <span class="material-symbols-rounded md-18 input-icon">mail</span>
            <input type="email" id="email" class="form-input" required
              placeholder="admin@ladiabla.com" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span class="material-symbols-rounded md-16" style="color: var(--primary, #DC2626); margin-right: 5px;">lock</span>
            Contraseña Maestra
          </label>
          <div class="input-icon-wrap input-password-wrap">
            <span class="material-symbols-rounded md-18 input-icon">lock</span>
            <input type="password" id="password" class="form-input" required
              placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="btn-pw-toggle" id="pwToggleBtn"
              onclick="togglePasswordVisibility()" title="Mostrar u ocultar contraseña" aria-label="Mostrar contraseña">
              <span class="material-symbols-rounded md-20" id="pwToggleIcon">visibility</span>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-alert" style="display: none;">
          <span class="material-symbols-rounded md-18">error</span>
          Credenciales incorrectas o acceso no autorizado.
        </div>

        <button type="submit" id="loginSubmitBtn" class="login-submit-btn">
          <span class="material-symbols-rounded md-20">login</span>
          Ingresar al Dashboard
        </button>
      </form>

      <!-- Nota de seguridad compacta -->
      <div class="login-footer-info">
        <span class="material-symbols-rounded md-22" style="color: var(--primary, #DC2626); flex-shrink: 0;">shield</span>
        <div>
          <span style="color: var(--text-main); font-weight: 700;">Acceso Encriptado</span>
          <span style="color: var(--text-muted); margin-left: 4px;">— Sesión administrativa segura.</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase App SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALoHHu4zV9IpwAljGHWjHskoqEvHSKMFQ",
      authDomain: "ladiabla-11718.firebaseapp.com",
      projectId: "ladiabla-11718",
      storageBucket: "ladiabla-11718.firebasestorage.app",
      messagingSenderId: "724540997267",
      appId: "1:724540997267:web:c7932bc391104f4886612d"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── ANIMACIÓN DEL OJITO CON EFECTO MATRIX (IGUAL A LA APP) ──
    let isAnimatingPw = false;
    function togglePasswordVisibility() {
      const pwInput = document.getElementById('password');
      const icon = document.getElementById('pwToggleIcon');
      const toggleBtn = document.getElementById('pwToggleBtn');
      if (!pwInput || isAnimatingPw) return;

      const isPassword = pwInput.type === 'password';
      const originalText = pwInput.value;

      // Animación micro-rebote del ojito
      icon.classList.remove('eye-pop');
      void icon.offsetWidth;
      icon.classList.add('eye-pop');

      if (!originalText) {
        pwInput.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        return;
      }

      // Animación scramble estilo DiablaTextField de la app Flutter
      isAnimatingPw = true;
      const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const totalIterations = 8;
      let iterations = 0;

      pwInput.type = 'text';

      const interval = setInterval(() => {
        iterations++;
        if (iterations >= totalIterations) {
          clearInterval(interval);
          pwInput.value = originalText;
          pwInput.type = isPassword ? 'text' : 'password';
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
          toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
          isAnimatingPw = false;
        } else {
          let scramble = '';
          for (let i = 0; i < originalText.length; i++) {
            scramble += chars[Math.floor(Math.random() * chars.length)];
          }
          pwInput.value = scramble;
        }
      }, 26);
    }

    // ── FORMULARIO DE ACCESO ──
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');

      btn.innerHTML = '<span class="material-symbols-rounded md-20" style="animation: spin 1s infinite linear;">sync</span> Verificando...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      const emailHash = await sha256(email.toLowerCase());
      const passHash = await sha256(password);

      const validEmailHash = 'd6d2d19c04b40f62595a5f0c3271895d2e2ba1f61dcaffedc2f85a2791eaf811';
      const validPassHash  = '0eb770958fcde1c432206d03a4f3a8aa9a268c274bf52f7eadeb0a159d11b790';

      if (emailHash === validEmailHash && passHash === validPassHash) {
        sessionStorage.setItem('diabla_admin_auth', 'true');
        sessionStorage.setItem('diabla_admin_email', email);
        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        } catch (err) {
          try {
            await firebase.auth().createUserWithEmailAndPassword(email, password);
          } catch (_) {
            try { await firebase.auth().signInAnonymously(); } catch (_) { }
          }
        }
        window.location.href = '../admin/';
      } else {
        errorDiv.style.display = 'flex';
        btn.innerHTML = '<span class="material-symbols-rounded md-20">login</span> Ingresar al Dashboard';
        btn.disabled = false;
      }
    });

    // ── TEMA CLARO / OSCURO ──
    function toggleWebTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('diabla_web_theme', next);
      updateThemeToggleBtnLabel(next);
    }
    function updateThemeToggleBtnLabel(theme) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (icon) icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      if (label) label.textContent = theme === 'dark' ? 'Claro' : 'Oscuro';
    }
    window.addEventListener('DOMContentLoaded', () => {
      updateThemeToggleBtnLabel(document.documentElement.getAttribute('data-theme') || 'light');
    });

    // ── ANIMACIÓN REACTIVA AL CLICK EN EL LOGO ───────────────
    document.addEventListener('click', (e) => {
      const logo = e.target.closest('.brand-logo-img, .logo-container img');
      if (logo) {
        logo.classList.remove('logo-wobble');
        void logo.offsetWidth;
        logo.classList.add('logo-wobble');
        setTimeout(() => logo.classList.remove('logo-wobble'), 650);
      }
    });
  </script>

</body>

</html>
