<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | La Diabla 🌶️</title>
  <meta name="description" content="Panel de acceso administrativo de La Diabla App.">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/logo/LaDiabla.png">
  <link rel="shortcut icon" type="image/png" href="../assets/logo/LaDiabla.png">
  <link rel="apple-touch-icon" href="../assets/logo/LaDiabla.png">
  <!-- Google Fonts: Bangers & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols Rounded -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="../styles.css?v=3.5">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('diabla_web_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    /* ── SCROLLBAR PERSONALIZADA CON FONDO BLANCO ────────────── */
    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFFFF !important;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #EF4444 0%, #DC2626 50%, #991B1B 100%) !important;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #F87171 0%, #EF4444 50%, #B91C1C 100%) !important;
    }
    html, body, * {
      scrollbar-color: #DC2626 #FFFFFF !important;
      scrollbar-width: thin;
    }

    /* ── LOGIN CENTRADO Y ULTRA-LIMPIO ───────────────────────── */
    html, body {
      min-height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(220, 38, 38, 0.07) 0%, transparent 65%), var(--bg-body);
      color: var(--text-main);
      transition: background-color 0.3s ease;
    }

    .login-main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      position: relative;
    }

    /* Tarjeta compacta y elegante */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 2.6rem 2.2rem;
      width: 100%;
      max-width: 430px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(220, 38, 38, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-card-logo-wrap {
      margin: 0 auto 1.1rem;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.22) 0%, rgba(127, 29, 29, 0.3) 100%);
      border: 2px solid rgba(220, 38, 38, 0.5);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
    }

    .login-card-logo-wrap img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: contain;
    }

    .login-title {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--primary, #DC2626);
      margin-bottom: 0.35rem;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* ── INPUT PASSWORD CON ANIMACIÓN DEL OJITO ───────────────── */
    .input-password-wrap {
      position: relative;
    }

    .input-password-wrap .form-input {
      padding-right: 48px !important;
      font-family: inherit;
    }

    .btn-pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }

    .btn-pw-toggle:hover {
      color: var(--primary, #DC2626);
      background: rgba(220, 38, 38, 0.12);
    }

    .btn-pw-toggle .material-symbols-rounded {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .eye-pop {
      animation: eyeBounce 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes eyeBounce {
      0% {
        transform: scale(0.65) rotate(-15deg);
        color: #EF4444;
      }
      60% {
        transform: scale(1.22) rotate(6deg);
        color: #F59E0B;
      }
      100% {
        transform: scale(1) rotate(0deg);
      }
    }

    .login-submit-btn {
      width: 100%;
      justify-content: center;
      padding: 0.95rem;
      font-size: 1rem;
      margin-top: 0.6rem;
      gap: 8px;
      border-radius: 14px;
    }

    .login-footer-info {
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px dashed var(--divider);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.82rem;
    }

    .error-alert {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-main-container {
        padding: 1.5rem 1rem;
      }
      .login-card {
        padding: 2rem 1.35rem;
        border-radius: 22px;
      }
      .login-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="navbar">
      <a href="../index.html" class="logo-container brand-logo-link">
        <img src="../assets/logo/LaDiabla.png" alt="La Diabla" class="brand-logo-img"
          onerror="this.src='../logo/LaDiabla.png';" style="flex-shrink:0;">
        <span class="logo-text diabla-font" style="color: #FFFFFF !important;">LA DIABLA ADMIN</span>
      </a>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button onclick="toggleWebTheme()" id="themeToggleBtn" class="btn-icon-text" title="Cambiar Tema">
          <span class="material-symbols-rounded md-20" id="themeIcon">light_mode</span>
          <span id="themeLabel">Claro</span>
        </button>
        <a href="../index.html" class="btn-icon-text" style="text-decoration: none;">
          <span class="material-symbols-rounded md-20">arrow_back</span>
          <span>Inicio</span>
        </a>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL CENTRADO -->
  <main class="login-main-container">
    <div class="login-card">

      <!-- Logo & Encabezado -->
      <div class="login-header">
        <div class="login-card-logo-wrap">
          <img src="../assets/logo/LaDiabla.png" alt="La Diabla" onerror="this.src='../logo/LaDiabla.png';" class="brand-logo-img" style="animation: logoFlamePulse 3s infinite ease-in-out;">
        </div>
        <h1 class="login-title">PANEL DE CONTROL</h1>
        <p class="login-subtitle">Acceso exclusivo para administradores de La Diabla</p>
      </div>

      <!-- Formulario de Login -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">
            <span class="material-symbols-rounded md-18" style="color: var(--primary); margin-right: 6px;">mail</span>
            Correo Electrónico
          </label>
          <div class="input-icon-wrap">
            <span class="material-symbols-rounded md-20 input-icon">mail</span>
            <input type="email" id="email" class="form-input form-input-icon" required
              placeholder="admin@ladiabla.com" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span class="material-symbols-rounded md-18" style="color: var(--primary); margin-right: 6px;">lock</span>
            Contraseña Maestra
          </label>
          <div class="input-icon-wrap input-password-wrap">
            <span class="material-symbols-rounded md-20 input-icon">lock</span>
            <input type="password" id="password" class="form-input form-input-icon" required
              placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="btn-pw-toggle" id="pwToggleBtn"
              onclick="togglePasswordVisibility()" title="Mostrar u ocultar contraseña" aria-label="Mostrar contraseña">
              <span class="material-symbols-rounded md-22" id="pwToggleIcon">visibility</span>
            </button>
          </div>
        </div>

        <div id="loginError" class="error-alert" style="display: none;">
          <span class="material-symbols-rounded md-20">error</span>
          Credenciales incorrectas o acceso no autorizado.
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-primary login-submit-btn">
          <span class="material-symbols-rounded md-20">login</span>
          Ingresar al Dashboard
        </button>
      </form>

      <!-- Nota de seguridad -->
      <div class="login-footer-info">
        <span class="material-symbols-rounded md-24" style="color: var(--primary); flex-shrink:0;">shield</span>
        <div>
          <p style="font-size: 0.82rem; color: var(--text-main); font-weight: 700; margin-bottom: 2px;">Acceso Protegido y Encriptado</p>
          <p style="font-size: 0.76rem; color: var(--text-muted); margin: 0;">Sesión administrativa con validación criptográfica SHA-256.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase App SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALoHHu4zV9IpwAljGHWjHskoqEvHSKMFQ",
      authDomain: "ladiabla-11718.firebaseapp.com",
      projectId: "ladiabla-11718",
      storageBucket: "ladiabla-11718.firebasestorage.app",
      messagingSenderId: "724540997267",
      appId: "1:724540997267:web:c7932bc391104f4886612d"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── ANIMACIÓN DEL OJITO CON EFECTO MATRIX (IGUAL A LA APP) ──
    let isAnimatingPw = false;
    function togglePasswordVisibility() {
      const pwInput = document.getElementById('password');
      const icon = document.getElementById('pwToggleIcon');
      const toggleBtn = document.getElementById('pwToggleBtn');
      if (!pwInput || isAnimatingPw) return;

      const isPassword = pwInput.type === 'password';
      const originalText = pwInput.value;

      // Animación micro-rebote del ojito
      icon.classList.remove('eye-pop');
      void icon.offsetWidth;
      icon.classList.add('eye-pop');

      if (!originalText) {
        pwInput.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        return;
      }

      // Animación scramble estilo DiablaTextField de la app Flutter
      isAnimatingPw = true;
      const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const totalIterations = 8;
      let iterations = 0;

      pwInput.type = 'text';

      const interval = setInterval(() => {
        iterations++;
        if (iterations >= totalIterations) {
          clearInterval(interval);
          pwInput.value = originalText;
          pwInput.type = isPassword ? 'text' : 'password';
          icon.textContent = isPassword ? 'visibility_off' : 'visibility';
          toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
          isAnimatingPw = false;
        } else {
          let scramble = '';
          for (let i = 0; i < originalText.length; i++) {
            scramble += chars[Math.floor(Math.random() * chars.length)];
          }
          pwInput.value = scramble;
        }
      }, 26);
    }

    // ── FORMULARIO DE ACCESO ──
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');

      btn.innerHTML = '<span class="material-symbols-rounded md-20" style="animation: spin 1s infinite linear;">sync</span> Verificando...';
      btn.disabled = true;
      errorDiv.style.display = 'none';

      const emailHash = await sha256(email.toLowerCase());
      const passHash = await sha256(password);

      const validEmailHash = 'd6d2d19c04b40f62595a5f0c3271895d2e2ba1f61dcaffedc2f85a2791eaf811';
      const validPassHash  = '0eb770958fcde1c432206d03a4f3a8aa9a268c274bf52f7eadeb0a159d11b790';

      if (emailHash === validEmailHash && passHash === validPassHash) {
        sessionStorage.setItem('diabla_admin_auth', 'true');
        sessionStorage.setItem('diabla_admin_email', email);
        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        } catch (err) {
          try {
            await firebase.auth().createUserWithEmailAndPassword(email, password);
          } catch (_) {
            try { await firebase.auth().signInAnonymously(); } catch (_) { }
          }
        }
        window.location.href = '../admin/';
      } else {
        errorDiv.style.display = 'flex';
        btn.innerHTML = '<span class="material-symbols-rounded md-20">login</span> Ingresar al Dashboard';
        btn.disabled = false;
      }
    });

    // ── TEMA CLARO / OSCURO ──
    function toggleWebTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('diabla_web_theme', next);
      updateThemeToggleBtnLabel(next);
    }
    function updateThemeToggleBtnLabel(theme) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (icon) icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      if (label) label.textContent = theme === 'dark' ? 'Claro' : 'Oscuro';
    }
    window.addEventListener('DOMContentLoaded', () => {
      updateThemeToggleBtnLabel(document.documentElement.getAttribute('data-theme') || 'light');
    });
  </script>

</body>

</html>
