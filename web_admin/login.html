<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | La Diabla 🌶️</title>
  <meta name="description" content="Panel de acceso administrativo de La Diabla App.">
  <!-- Google Fonts: Bangers & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols Rounded -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="styles.css?v=3.0">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('diabla_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>

<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="logo-container">
        <img src="../recursos/materiales/chileboton.png" alt="La Diabla"
          style="width:42px; height:42px; border-radius:50%; object-fit:contain; box-shadow: 0 4px 14px rgba(220,38,38,0.5); flex-shrink:0;">
        <span class="logo-text diabla-font">LA DIABLA ADMIN</span>
      </a>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button onclick="toggleWebTheme()" id="themeToggleBtn" class="btn-icon-text" title="Cambiar Tema">
          <span class="material-symbols-rounded md-20" id="themeIcon">light_mode</span>
          <span id="themeLabel">Claro</span>
        </button>
        <a href="index.html" class="btn-icon-text" style="text-decoration: none;">
          <span class="material-symbols-rounded md-20">arrow_back</span>
          <span>Inicio</span>
        </a>
      </div>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="login-card">

      <!-- Logo & Branding -->
      <div class="login-header">
        <div
          style="margin: 0 auto 1.25rem; width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(220,38,38,0.08); box-shadow: 0 10px 30px rgba(220,38,38,0.25);">
          <img src="../recursos/materiales/chileboton.png" alt="La Diabla"
            style="width: 88px; height: 88px; border-radius: 50%; object-fit: contain;">
        </div>
        <h1 class="diabla-font login-title">PANEL DE CONTROL</h1>
        <p class="login-subtitle">Acceso exclusivo para administradores de La Diabla</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">
            <span class="material-symbols-rounded md-18" style="color: var(--primary); margin-right: 6px;">mail</span>
            Correo Electrónico
          </label>
          <div class="input-icon-wrap">
            <span class="material-symbols-rounded md-20 input-icon">mail</span>
            <input type="email" id="email" class="form-input form-input-icon" value="appladiabla@gmail.com" required
              placeholder="correo@ejemplo.com">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span class="material-symbols-rounded md-18" style="color: var(--primary); margin-right: 6px;">lock</span>
            Contraseña Maestra
          </label>
          <div class="input-icon-wrap">
            <span class="material-symbols-rounded md-20 input-icon">lock</span>
            <input type="password" id="password" class="form-input form-input-icon" value="diablaadmin1" required
              placeholder="••••••••">
          </div>
        </div>

        <div id="loginError" class="error-alert" style="display: none;">
          <span class="material-symbols-rounded md-20">error</span>
          Credenciales inválidas. Verifica tu correo y contraseña.
        </div>

        <button type="submit" class="btn-primary login-submit-btn">
          <span class="material-symbols-rounded md-20">login</span>
          Ingresar al Dashboard
        </button>
      </form>

      <div class="login-footer-info">
        <span class="material-symbols-rounded md-24" style="color: var(--primary);">shield</span>
        <div>
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">Credenciales de acceso rápido:</p>
          <p style="font-size: 0.85rem;">
            <strong style="color: #FF8080;">appladiabla@gmail.com</strong>
            &nbsp;/&nbsp;
            <strong style="color: #FF8080;">diablaadmin1</strong>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase App SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyALoHHu4zV9IpwAljGHWjHskoqEvHSKMFQ",
      authDomain: "ladiabla-11718.firebaseapp.com",
      projectId: "ladiabla-11718",
      storageBucket: "ladiabla-11718.firebasestorage.app",
      messagingSenderId: "724540997267",
      appId: "1:724540997267:web:c7932bc391104f4886612d"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btn = this.querySelector('button[type="submit"]');
      btn.innerHTML = '<span class="material-symbols-rounded md-20" style="animation: spin 1s infinite linear;">sync</span> Verificando...';
      btn.disabled = true;

      if (email.toLowerCase() === 'appladiabla@gmail.com' && password === 'diablaadmin1') {
        sessionStorage.setItem('diabla_admin_auth', 'true');
        sessionStorage.setItem('diabla_admin_email', email);
        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        } catch (err) {
          try {
            await firebase.auth().createUserWithEmailAndPassword(email, password);
          } catch (_) {
            try { await firebase.auth().signInAnonymously(); } catch (_) { }
          }
        }
        window.location.href = 'dashboard.html';
      } else {
        errorDiv.style.display = 'flex';
        btn.innerHTML = '<span class="material-symbols-rounded md-20">login</span> Ingresar al Dashboard';
        btn.disabled = false;
      }
    });

    function toggleWebTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('diabla_web_theme', next);
      updateThemeToggleBtnLabel(next);
    }
    function updateThemeToggleBtnLabel(theme) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (icon) icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
      if (label) label.textContent = theme === 'dark' ? 'Claro' : 'Oscuro';
    }
    window.addEventListener('DOMContentLoaded', () => {
      updateThemeToggleBtnLabel(document.documentElement.getAttribute('data-theme') || 'dark');
    });
  </script>

</body>

</html>
